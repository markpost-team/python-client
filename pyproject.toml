[project]
name = "markpost"
version = "0.0.1"
description = "Python client for Markpost API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Markpost Team" }]
keywords = ["markpost", "markdown", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["requests>=2.25.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "tox>=4.0",
    "tox-uv>=1.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://markpost.cc"
Repository = "https://github.com/markpost-team/python-client"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.tox]
env_list = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
with_dev = true
commands = [["pytest"]]
