[project]
name = "markpost"
version = "0.2.0-rc.2"
description = "Python client for the Markpost API (sync + async, typed)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
authors = [{ name = "Markpost Team" }]
keywords = ["markpost", "markdown", "api", "client", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.9",
    "mypy>=1.10",
    "twine>=6.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://markpost.cc"
Repository = "https://github.com/markpost-team/python-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markpost"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Treat unexpected warnings as errors (deps can drift; allow-list here if a
# third-party warning is genuine and unavoidable).
filterwarnings = [
    "error",
]
markers = [
    "e2e: end-to-end tests requiring a live markpost container (deselect with -m 'not e2e')",
]

[tool.coverage.run]
source = ["markpost"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# markpost/__init__.py re-exports the public API; star-style false positives
# from F403/F405 are expected there.
"__init__.py" = ["F403"]

[tool.mypy]
# Strict typing for the shipped library (we publish py.typed). Tests are checked
# but not required to be fully annotated — mirrors the httpx policy.
strict = true
ignore_missing_imports = true
# The request pipeline (``_request`` / ``_handle_response``) dispatches JSON
# payloads through a runtime ``TypeAdapter`` that statically resolves to ``Any``;
# mypy cannot correlate the ``model``/``text``/``allow_304`` flags with the
# concrete return type at each call site. Every public method keeps a precise
# return annotation (the actual public-API contract), so we don't flag the
# ``Any`` flowing out of the dispatcher itself. Tightening this would force
# ~40 ``cast()`` calls whose only job is to defeat a false positive.
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
