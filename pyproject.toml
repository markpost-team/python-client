[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "markpost"
version = "0.2.0-rc.2"
description = "Python client for the Markpost API (sync + async, typed)"
readme = "README.md"
keywords = [ "api", "client", "markdown", "markpost", "sdk" ]
license = "MIT"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Markpost Team" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4",
  "httpx>=0.27",
  "pydantic>=2",
]
urls.Homepage = "https://markpost.cc"
urls.Repository = "https://github.com/markpost-team/python-client"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=2.3",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  # Version lower bound aligns with the ruff rev pinned in prek.toml
  # (single-config-source principle: local uv, prek hook, and CI must not drift).
  "ruff>=0.15.2",
  # tox stack — local `tox` runs the py3.10–3.14 unit matrix; tox-uv drives env
  # creation via `uv sync` (reuses this lock file); tox-gh maps the CI matrix
  # Python version to the matching env. Listed as dev deps so contributors get
  # `tox` out of `scripts/install`; CI installs them as `uv tool` instead.
  "tox>=4.58",
  "tox-gh>=1.8",
  "tox-uv>=1.36",
  "twine>=6",
]

[tool.hatch]
build.targets.wheel.packages = [ "markpost" ]

[tool.ruff]
target-version = "py310"
# 120 is the project-wide line width (.editorconfig, ruff, mypy all agree).
# ruff's default of 88 fights with the rest of the config — pin it explicitly.
line-length = 120
indent-width = 4
exclude = [ ".local", ".venv", "build", "dist", "node_modules" ]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
# Enable the stable rule families. We do NOT enable:
#   ANN — annotation enforcement (mypy strict already covers typing precisely);
#   D   — docstring format (we require docstrings, but not a specific style);
#   TD/FIX — TODO tracking (TODOs are a normal workflow signal).
lint.select = [
  "A",
  "ASYNC",
  "B",
  "B9",    # bugbear
  "BLE",   # async / builtin shadow / blind except
  "C4",    # comprehensions
  "C90",   # mccabe complexity
  "E",
  "F",     # pyflakes
  "FURB",
  "G",     # logging
  "I",     # isort (import sorting)
  "LOG",
  "N",     # pep8-naming
  "PERF",  # perflint
  "PGH",
  "PIE",
  "PLR",
  "PLW",   # pylint subset
  "PT",    # pytest-style
  "PTH",   # prefer pathlib
  "RET",
  "RUF",   # pie / pygrep / ruff native
  "S",     # bandit security (S rules replace standalone bandit)
  "SIM",   # simplify
  "TC",
  "TID",
  "UP",    # pyupgrade
  "W",     # pycodestyle errors + warnings
  "YTT",
]
lint.ignore = [
  "E501",    # line-too-long — line-length is enforced by the formatter
  "PLR2004", # magic-value-comparison (0/200 etc. are noise in an SDK)
  "PT018",   # pytest parameter default / compound assertion (false positives)
  "PT028",
  "RUF043",  # pytest-raises pattern (false positive)
  # TC (flake8-type-checking) suggests moving imports under TYPE_CHECKING, but
  # this project uses Pydantic v2 models that need their annotations resolvable
  # at runtime (model_rebuild). Moving datetime / httpx imports under
  # TYPE_CHECKING breaks Pydantic validation — verified. Safe to keep the
  # imports at module level.
  "TC001",
  "TC002",
  "TC003",
]
# The .claude/hooks/*.py scripts ARE subprocess runners by design — the commands
# they execute are hardcoded inside the script, not untrusted input, so S603
# (untrusted-subprocess) is a false positive there.
lint.per-file-ignores.".claude/hooks/*.py" = [ "S603", "S604" ]
# markpost/__init__.py re-exports the public API; star-style false positives
# from F403/F405 are expected there. RUF022 wants __all__ sorted, but we
# intentionally group it (Clients / Models / Exceptions / Meta) for readability.
lint.per-file-ignores."__init__.py" = [ "F403", "RUF022" ]
# The shipped library has a few legitimate SDK patterns that are real false
# positives at the transport boundary:
#   A002    — public API kwargs named `format` / `id` / `type` (HTTP API terms,
#             renaming would break user code);
#   BLE001  — the request pipeline catches broad Exception to convert *any*
#             transport failure into an APIError subclass (the core SDK contract);
#   S311    — random.random() is jitter for retry backoff, not crypto;
#   SIM102/SIM103 — explicit, SPEC-mirroring control flow in the retry policy.
lint.per-file-ignores."markpost/*.py" = [ "A002", "BLE001", "S311", "SIM102", "SIM103" ]
# Tests legitimately hard-code secrets, use assert, compare to magic values,
# swallow broad exceptions in cleanup, and use contextlib.suppress / nested
# try for teardown — all expected in test/integration code.
lint.per-file-ignores."tests/**" = [ "BLE001", "PERF203", "PERF401", "PLR2004", "PLW0108", "PT", "S", "S101", "SIM105" ]
lint.isort.known-first-party = [ "markpost" ]
lint.mccabe.max-complexity = 15  # default 10; the client dispatch is denser
# The _request dispatcher carries 9 kwargs (method, path + auth/json/params/
# model/text/extra_headers/allow_304) — that is the honest, minimal surface
# for a typed HTTP API client. Loosened from the default of 5 accordingly.
lint.pylint.max-args = 9
lint.pylint.max-branches = 12
lint.pylint.max-positional-args = 5
lint.pylint.max-returns = 8
lint.pylint.max-statements = 60

[tool.mypy]
ignore_missing_imports = true
# Strict typing for the shipped library (we publish py.typed). Tests are checked
# but not required to be fully annotated — mirrors the httpx policy.
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
# The request pipeline (``_request`` / ``_handle_response``) dispatches JSON
# payloads through a runtime ``TypeAdapter`` that statically resolves to ``Any``;
# mypy cannot correlate the ``model``/``text``/``allow_304`` flags with the
# concrete return type at each call site. Every public method keeps a precise
# return annotation (the actual public-API contract), so we don't flag the
# ``Any`` flowing out of the dispatcher itself. Tightening this would force
# ~40 ``cast()`` calls whose only job is to defeat a false positive.
warn_return_any = false
strict = true
overrides = [ { module = "tests.*", disallow_untyped_defs = false, check_untyped_defs = true } ]
no_implicit_optional = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.markers = [
  "e2e: end-to-end tests requiring a live markpost container (deselect with -m 'not e2e')",
]
# Treat unexpected warnings as errors (deps can drift; allow-list here if a
# third-party warning is genuine and unavoidable).
ini_options.filterwarnings = [
  "error",
]
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.branch = true
run.source = [ "markpost" ]
report.exclude_lines = [
  "\\.\\.\\.",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.fail_under = 90

# tox — multi-version unit-test matrix ONLY. lint / typecheck / build stay in
# scripts/* + the CI lint job; do NOT add lint/type/build envs here (orthogonal
# responsibilities, see AGENTS.md "Boundaries"). Test deps come from the dev
# dependency-group above — never redeclare them via tox `deps`, that would
# duplicate the single source of truth and let the two lists drift.
[tool.tox]
# `requires` provisions the plugins into tox's own runner env on first use, so
# neither contributors nor CI need to pre-install tox-uv/tox-gh by hand.
requires = [ "tox-gh>=1.8", "tox-uv>=1.25" ]
env_list = [ "py314", "py313", "py312", "py311", "py310" ]
env_run_base.commands = [
  # `-m "not e2e"` mirrors scripts/test: the e2e tier needs a live container
  # and is invoked separately via tests/e2e/run.sh. `--cov` reads
  # [tool.coverage] above; fail_under=90 fails the env if coverage drops.
  [ "pytest", "-m", "not e2e", "--cov", { replace = "posargs", default = [], extend = true } ],
]
# Reuse the PEP 735 dev group — pytest/respx/pytest-cov/etc. come from here.
env_run_base.dependency_groups = [ "dev" ]
env_run_base.description = "run the unit test suite under coverage (mocked transport, no e2e)"
# uv-venv-lock-runner: resolve via `uv sync` against uv.lock, so local and CI
# install byte-identical versions (the lock already covers py3.10–3.14).
env_run_base.runner = "uv-venv-lock-runner"
# tox-gh: inside GitHub Actions, auto-select the env that matches the runner's
# Python version (1:1 mapping — each matrix cell runs exactly its own py env).
# Locally this section is inert; `tox` runs the full env_list above.
gh.python."3.10" = [ "py310" ]
gh.python."3.11" = [ "py311" ]
gh.python."3.12" = [ "py312" ]
gh.python."3.13" = [ "py313" ]
gh.python."3.14" = [ "py314" ]
