# Quality gate: lint, type-check, build, and unit-test every push/PR.
#
# Mirrors the local scripts/ entrypoints so CI and contributors run the exact
# same checks. Third-party actions are pinned to immutable commit SHAs (the
# trailing comment carries the readable version); dependabot bumps the SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel a superseded run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Skip the whole pipeline on doc-only changes; nothing to verify there.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: scripts/install
      - run: scripts/lint
      - run: scripts/typecheck
      - name: Build & validate distribution
        run: scripts/build

  unit:
    name: Unit tests (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full supported range per pyproject.toml requires-python + [tool.tox].
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # tox (+ tox-uv/tox-gh) drives the matrix; tox-gh auto-selects the env
      # matching this runner's Python version. Env definition lives in
      # pyproject.toml [tool.tox] — single source of truth.
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox
