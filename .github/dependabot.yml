# Dependabot keeps dependencies and GitHub Actions current.
# - uv ecosystem: bumps the lockfile + dev dependency group (one grouped PR).
# - github-actions: bumps the SHA-pinned actions in .github/workflows.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
